# Publish this directory to GitHub Pages.
#
# The legacy branch-based publisher was failing on this site ("Page build
# failed"), and the Next.js static export is the reason: it emits ~465 segment
# prefetch files whose names contain "$" (e.g. __next.approaches/$d$slug.txt).
# This workflow uploads the tree as an artifact instead, which does no Jekyll
# processing and does not care what a file is called.
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
